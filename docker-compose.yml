services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

  app:
    build: ./app
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/shortener
      - REDIS_URL=redis://redis:6379/0
      - USE_CACHE=true
    depends_on:
      - postgres
      - redis

  postgres: 
    image: postgres:13-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=shortener
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 1089M

  redis:
    image: redis:7-alpine